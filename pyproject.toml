[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-vpc-flowlog-coverage"
version = "0.1.0"
description = "Audit VPC Flow Log coverage: missing logs, logs that stopped delivering, and subnet-only configs that leave the rest of the VPC dark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "vpc", "flow-logs", "security", "sre", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["boto3>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "flake8>=7.5"]

[project.urls]
Homepage = "https://github.com/moveeeax/aws-vpc-flowlog-coverage"
Issues = "https://github.com/moveeeax/aws-vpc-flowlog-coverage/issues"

[project.scripts]
aws-vpc-flowlog-coverage = "aws_vpc_flowlog_coverage.cli:main"

[tool.setuptools]
packages = ["aws_vpc_flowlog_coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
