name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: flake8 aws_vpc_flowlog_coverage tests examples

      - name: Test
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          aws-vpc-flowlog-coverage --version
          aws-vpc-flowlog-coverage --help > /dev/null

      - name: Run the offline example
        run: |
          python examples/offline_demo.py
          python examples/offline_demo.py --format json | python -c "import json,sys; json.load(sys.stdin)"
